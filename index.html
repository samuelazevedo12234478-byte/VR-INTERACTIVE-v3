<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mão Virtual VR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1635913746/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620919413/drawing_utils.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }
        h1 {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #f0f0f0;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: bold;
            z-index: 20;
            letter-spacing: 1px;
        }
        #video {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0.12;
            transform: scaleX(-1);
            display: none;
        }
        #canvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            transform: scaleX(-1);
            z-index: 10;
        }
        #btnIniciar {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 30;
            background: linear-gradient(135deg, #0099ff, #00eeff, #00ccff);
            color: #ffffff;
            font-weight: bold;
            font-size: 22px;
            padding: 18px 45px;
            border-radius: 60px;
            border: none;
            box-shadow: 0 0 25px #00ccff, 0 0 50px rgba(0,204,255,0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #btnIniciar:active {
            transform: translate(-50%, -50%) scale(0.96);
            box-shadow: 0 0 35px #00eeff, 0 0 60px rgba(0,238,255,0.6);
        }
        .status {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,20,0.8);
            padding: 12px 25px;
            border-radius: 50px;
            color: #dddddd;
            border: 1px solid #555;
            font-size: 14px;
            z-index: 25;
            max-width: 90%;
            text-align: center;
        }
        .erro { color: #ff8888 !important; border-color: #ff6666 !important; }
    </style>
</head>
<body>
    <h1>Mão Virtual VR</h1>
    <button id="btnIniciar">📷 Iniciar Câmera Traseira</button>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="status" id="status">⏳ Aperte o botão acima para começar</div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status');
        const btnIniciar = document.getElementById('btnIniciar');
        let hands, camera;

        function ajustarTamanho() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarTamanho);
        ajustarTamanho();

        async function iniciarRastreamento() {
            statusText.innerText = "🔄 Solicitando permissão da câmera...";
            btnIniciar.disabled = true;
            btnIniciar.innerText = "Aguarde...";

            try {
                // 1. Primeiro pede acesso à câmera COM O CLIQUE DO USUÁRIO
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;

                // 2. Depois carrega o rastreador
                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.65,
                    minTrackingConfidence: 0.65
                });

                hands.onResults((results) => {
                    statusText.innerText = results.multiHandLandmarks 
                        ? "✅ Mão detectada! Movimente!" 
                        : "⏳ Aguardando mão...";
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                    if (results.multiHandLandmarks) {
                        for (const landmarks of results.multiHandLandmarks) {
                            canvasCtx.lineWidth = 7;
                            canvasCtx.lineCap = 'round';
                            canvasCtx.lineJoin = 'round';
                            const gradiente = canvasCtx.createLinearGradient(0,0, canvasElement.width, canvasElement.height);
                            gradiente.addColorStop(0, 'rgba(130,130,130,0.85)');
                            gradiente.addColorStop(1, 'rgba(245,245,245,0.95)');
                            canvasCtx.strokeStyle = gradiente;
                            canvasCtx.shadowColor = '#ffffff';
                            canvasCtx.shadowBlur = 12;

                            const pontos = [0,1,2,3,4,0,5,6,7,8,9,10,11,12,5,9,13,14,15,16,17,18,19,20];
                            canvasCtx.beginPath();
                            for(let i=0; i<pontos.length; i++){
                                const p = landmarks[pontos[i]];
                                const x = p.x * canvasElement.width;
                                const y = p.y * canvasElement.height;
                                i===0 ? canvasCtx.moveTo(x,y) : canvasCtx.lineTo(x,y);
                            }
                            canvasCtx.stroke();

                            const dedos = [4,8,12,16,20];
                            dedos.forEach(i => {
                                const p = landmarks[i];
                                const x = p.x * canvasElement.width;
                                const y = p.y * canvasElement.height;
                                const gradPonta = canvasCtx.createRadialGradient(x,y,0,x,y,24);
                                gradPonta.addColorStop(0, 'rgba(255,255,255,0.95)');
                                gradPonta.addColorStop(1, 'rgba(200,200,200,0.2)');
                                canvasCtx.beginPath();
                                canvasCtx.arc(x,y,24,0,Math.PI*2);
                                canvasCtx.fillStyle = gradPonta;
                                canvasCtx.fill();
                                canvasCtx.beginPath();
                                canvasCtx.arc(x,y,8,0,Math.PI*2);
                                canvasCtx.fillStyle = '#ffffff';
                                canvasCtx.fill();
                            });
                        }
                    }
                });

                // 3. Inicia câmera do MediaPipe
                camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 1280, height: 720
                });
                await camera.start();

                statusText.innerText = "✅ Pronto! Coloque a mão na frente!";
                btnIniciar.style.display = 'none';
                videoElement.style.display = 'block';

            } catch (err) {
                console.error("Erro:", err);
                statusText.className = "status erro";
                
                // Mensagem exata do problema
                if (err.name === "NotAllowedError") {
                    statusText.innerHTML = "❌ Câmera bloqueada! Toque no 🔒 → Permissões → Câmera → Permitir";
                } else if (err.name === "NotFoundError") {
                    statusText.innerHTML = "❌ Câmera não encontrada!";
                } else {
                    statusText.innerHTML = "❌ Erro: " + err.message + "<br>Verifique permissões do site";
                }
                
                btnIniciar.disabled = false;
                btnIniciar.innerText = "📷 Tentar Novamente";
            }
        }

        btnIniciar.addEventListener('click', iniciarRastreamento);
    </script>
</body>
</html>
