<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidade Mista 3D - Tela & Grade</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      display: block;
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 400px;
    }

    #startBtn {
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: #0066ff;
      border: 3px solid #ffffff;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    #log {
      background: rgba(0, 0, 0, 0.85);
      color: #00ff88;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }
  </style>

  <!-- CDNs: Three.js e MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-container">
    <button id="startBtn">INICIAR AMBIENTE 3D</button>
    <div id="log">Clique para ativar a tela 3D e as linhas de calibração.</div>
  </div>

  <video id="webcam" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas3d = document.getElementById('canvas3d');
    const startBtn = document.getElementById('startBtn');
    const log = document.getElementById('log');

    // --- CENA THREE.JS ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0); // Posição do usuário no centro do espaço

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    // --- 1. LINHAS DE REALIDADE AUMENTADA / GRADE DE CALIBRAÇÃO (MR) ---
    // Cria a grade de linhas no chão igual aos sistemas de MR
    const gridHelper = new THREE.GridHelper(10, 20, 0x0066ff, 0x444444);
    gridHelper.position.y = -1.5;
    scene.add(gridHelper);

    // --- 2. JANELA 3D PURA (Aba Flutuante no Espaço) ---
    const windowGroup = new THREE.Group();

    // Painel principal da tela (Branco metálico / translúcido)
    const screenGeo = new THREE.PlaneGeometry(2.2, 1.3);
    const screenMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    windowGroup.add(screenMesh);

    // Borda preta/azul da tela 3D
    const borderGeo = new THREE.PlaneGeometry(2.26, 1.36);
    const borderMat = new THREE.MeshBasicMaterial({ color: 0x0066ff, side: THREE.DoubleSide });
    const borderMesh = new THREE.Mesh(borderGeo, borderMat);
    borderMesh.position.z = -0.01;
    windowGroup.add(borderMesh);

    // Posiciona a janela a 2.5 metros de distância
    windowGroup.position.set(0, 0.2, -2.5);
    scene.add(windowGroup);


    // --- 3. DUAS MÃOS 3D CINZAS ---
    const handMaterial = new THREE.MeshStandardMaterial({
      color: 0x888888,
      roughness: 0.3,
      metalness: 0.5
    });

    const jointGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const boneGeo = new THREE.CylinderGeometry(0.04, 0.04, 1, 8);

    const hands3D = [];

    for (let h = 0; h < 2; h++) {
      const group = new THREE.Group();
      scene.add(group);

      const joints = [];
      for (let i = 0; i < 21; i++) {
        const joint = new THREE.Mesh(jointGeo, handMaterial);
        joint.visible = false;
        group.add(joint);
        joints.push(joint);
      }

      const bones = [];
      for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
        const bone = new THREE.Mesh(boneGeo, handMaterial);
        bone.visible = false;
        group.add(bone);
        bones.push(bone);
      }

      hands3D.push({ group, joints, bones });
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    function mapTo3DSpace(lm) {
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance = 5;
      const height = 2 * Math.tan(fov / 2) * distance;
      const width = height * camera.aspect;

      const x = (lm.x - 0.5) * width;
      const y = -(lm.y - 0.5) * height;
      const z = -lm.z * width;

      return new THREE.Vector3(x, y, z);
    }

    // --- MEDIAPIPE HANDS ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      hands3D.forEach(h => {
        h.joints.forEach(j => j.visible = false);
        h.bones.forEach(b => b.visible = false);
      });

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        results.multiHandLandmarks.forEach((landmarks, handIndex) => {
          if (handIndex >= 2) return;

          const h3d = hands3D[handIndex];

          landmarks.forEach((lm, index) => {
            const pos = mapTo3DSpace(lm);
            h3d.joints[index].position.copy(pos);
            h3d.joints[index].visible = true;
          });

          HAND_CONNECTIONS.forEach((conn, index) => {
            const p1 = h3d.joints[conn[0]].position;
            const p2 = h3d.joints[conn[1]].position;

            const bone = h3d.bones[index];
            const dist = p1.distanceTo(p2);

            bone.scale.set(1, dist, 1);
            bone.position.copy(p1).add(p2).multiplyScalar(0.5);
            bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
            bone.visible = true;
          });
        });
      }
    });

    // --- ATIVAÇÃO DE CÂMERA E GIROSCÓPIO PARA MANTER A TELA FIXA NO ESPAÇO ---
    startBtn.addEventListener('click', async () => {
      log.innerText = "Acessando câmera e giroscópio...";
      startBtn.style.display = "none";

      // Solicita rotação dos sensores do celular
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (e) {
          console.warn("Permissão do giroscópio não concedida.");
        }
      }

      // Faz a câmera 3D rodar quando você vira o celular (mantendo a tela e as linhas fixas)
      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha !== null) {
          const alpha = THREE.MathUtils.degToRad(e.alpha || 0);
          const beta = THREE.MathUtils.degToRad(e.beta || 0);
          const gamma = THREE.MathUtils.degToRad(e.gamma || 0);

          camera.rotation.set(beta, alpha, -gamma, 'YXZ');
        }
      });

      try {
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        log.innerText = "MR Ativo! Olhe em volta para ver a tela e as linhas no espaço.";

        const processFrame = async () => {
          if (!video.paused && !video.ended) {
            await hands.send({ image: video });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        console.error(err);
        log.innerText = "Erro ao carregar câmera: " + err.message;
        startBtn.style.display = "block";
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
