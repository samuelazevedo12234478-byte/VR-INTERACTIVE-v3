<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidade Aumentada - Mão & Tela Fixa</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    /* Vídeo da Câmera no fundo */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Camada 3D da AR por cima da câmera */
    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* Interface do Botão na camada de topo */
    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 400px;
    }

    #startBtn {
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: #0066ff;
      border: 3px solid #ffffff;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    #log {
      background: rgba(0, 0, 0, 0.8);
      color: #00ff88;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-container">
    <button id="startBtn">INICIAR SESSÃO AR</button>
    <div id="log">Clique no botão para ativar a Realidade Aumentada</div>
  </div>

  <video id="webcam" playsinline webkit-playsinline></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas3d = document.getElementById('canvas3d');
    const startBtn = document.getElementById('startBtn');
    const log = document.getElementById('log');

    // --- CENA THREE.JS (AR ESPACIAL) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0); // Posição da câmera do utilizador

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    // --- 1. TELA BRANCA VIRTUAL FIXA NO MUNDO ---
    const screenGeo = new THREE.PlaneGeometry(1.6, 0.9);
    const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const virtualScreen = new THREE.Mesh(screenGeo, screenMat);
    
    // Posiciona a tela 2 metros à frente no espaço virtual
    virtualScreen.position.set(0, 0.2, -2);
    scene.add(virtualScreen);

    // Borda preta da tela branca
    const borderGeo = new THREE.PlaneGeometry(1.66, 0.96);
    const borderMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
    const screenBorder = new THREE.Mesh(borderGeo, borderMat);
    screenBorder.position.set(0, 0.2, -2.01);
    scene.add(screenBorder);


    // --- 2. ESTRUTURA DA LUVA CINZA 3D ---
    const handGroup = new THREE.Group();
    scene.add(handGroup);

    const handMaterial = new THREE.MeshStandardMaterial({
      color: 0x888888,
      roughness: 0.3,
      metalness: 0.4
    });

    // Articulações da mão
    const joints = [];
    const jointGeo = new THREE.SphereGeometry(0.025, 16, 16);

    for (let i = 0; i < 21; i++) {
      const joint = new THREE.Mesh(jointGeo, handMaterial);
      joint.visible = false;
      handGroup.add(joint);
      joints.push(joint);
    }

    // Ossos/Conexões
    const boneGeo = new THREE.CylinderGeometry(0.012, 0.012, 1, 8);
    const bones = [];

    for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
      const bone = new THREE.Mesh(boneGeo, handMaterial);
      bone.visible = false;
      handGroup.add(bone);
      bones.push(bone);
    }

    // Render loop Three.js
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();


    // --- 3. MEDIAPIPE HANDS (RASTREAMENTO) ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Atualizar pontos da luva cinza
        landmarks.forEach((lm, index) => {
          const x = (lm.x - 0.5) * 2;
          const y = -(lm.y - 0.5) * 2;
          const z = -lm.z * 2 - 1; // Projeta a mão à frente no espaço 3D

          joints[index].position.set(x, y, z);
          joints[index].visible = true;
        });

        // Atualizar conexões/ossos
        HAND_CONNECTIONS.forEach((conn, index) => {
          const p1 = joints[conn[0]].position;
          const p2 = joints[conn[1]].position;

          const bone = bones[index];
          const dist = p1.distanceTo(p2);

          bone.scale.set(1, dist, 1);
          bone.position.copy(p1).add(p2).multiplyScalar(0.5);
          bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
          bone.visible = true;
        });
      } else {
        joints.forEach(j => j.visible = false);
        bones.forEach(b => b.visible = false);
      }
    });


    // --- 4. ATIVAÇÃO DE CÂMERA E GIROSCÓPIO ---
    startBtn.addEventListener('click', async () => {
      log.innerText = "Iniciando câmera e AR...";
      startBtn.style.display = "none";

      // Ativar orientação do dispositivo para manter a tela fixa se suportado
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (e) {
          console.warn("Permissão de giroscópio recusada.");
        }
      }

      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha !== null) {
          // Ajusta a rotação da câmera com base nos sensores do celular
          const alpha = THREE.MathUtils.degToRad(e.alpha || 0);
          const beta = THREE.MathUtils.degToRad(e.beta || 0);
          const gamma = THREE.MathUtils.degToRad(e.gamma || 0);

          camera.rotation.set(beta, alpha, -gamma, 'YXZ');
        }
      });

      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
          });
        } catch (err) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
        }

        video.srcObject = stream;
        await video.play();

        log.innerText = "AR Ativa! Mostre a sua mão para ver a luva cinza.";

        const processFrame = async () => {
          if (!video.paused && !video.ended) {
            await hands.send({ image: video });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        log.innerText = "Erro ao acessar câmera: " + err.message;
        startBtn.style.display = "block";
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
