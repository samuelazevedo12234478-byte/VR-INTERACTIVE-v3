<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidade Aumentada - Luva 3D e Tela Fixa</title>
  
  <!-- Bibliotecas de AR, 3D e Tracking -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Interface de controle flutuante */
    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 400px;
      pointer-events: none;
    }

    .btn-ar {
      pointer-events: auto;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      background: #0066ff;
      border: 2px solid #ffffff;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    #status-log {
      background: rgba(0, 0, 0, 0.75);
      color: #00ff88;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }

    /* Esconde o vídeo bruto do MediaPipe para usar a câmera do A-Frame */
    #webcam-hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <button id="startBtn" class="btn-ar">INICIAR REALIDADE AUMENTADA</button>
    <div id="status-log">Aguardando início...</div>
  </div>

  <video id="webcam-hidden" playsinline></video>

  <!-- Cena A-Frame com AR.js (WebAR) -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <!-- Iluminação da cena -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-0.5 1 1"></a-entity>

    <!-- Marcador / Âncora Espacial: A tela e a luva ficam ancoradas no espaço -->
    <a-marker preset="hiro" id="ar-anchor">
      
      <!-- Painel/Tela Branca Virtual (Estilo Interface Quest) -->
      <a-plane 
        id="virtual-screen"
        position="0 1.2 -0.5" 
        rotation="-15 0 0"
        width="1.8" 
        height="1.0" 
        color="#FFFFFF"
        material="shader: flat; opacity: 0.95"
        shadow>
        
        <!-- Borda da tela -->
        <a-plane position="0 0 -0.01" width="1.86" height="1.06" color="#333333"></a-plane>
        
        <!-- Texto de teste dentro da tela branca -->
        <a-text 
          value="TELA VIRTUAL AR" 
          align="center" 
          color="#111111" 
          width="3" 
          position="0 0.2 0.01">
        </a-text>
        <a-text 
          value="Status: Rastreamento Ativo" 
          align="center" 
          color="#00aa55" 
          width="2" 
          position="0 -0.1 0.01">
        </a-text>
      </a-plane>

      <!-- Grupo 3D reservado para o esqueleto/luva cinza da mão -->
      <a-entity id="hand-container-3d"></a-entity>

    </a-marker>

    <!-- Câmera do usuário no mundo virtual -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('status-log');
    const hiddenVideo = document.getElementById('webcam-hidden');
    const handContainer = document.getElementById('hand-container-3d');

    // --- CRIAÇÃO DA LUVA CINZA EM THREE.JS DENTRO DO A-FRAME ---
    const joints3D = [];
    const handMaterial = new THREE.MeshStandardMaterial({
      color: 0x888888,
      roughness: 0.3,
      metalness: 0.5
    });

    // Criar as 21 esferas cinzas para as articulações
    for (let i = 0; i < 21; i++) {
      const sphereGeo = new THREE.SphereGeometry(0.02, 16, 16);
      const mesh = new THREE.Mesh(sphereGeo, handMaterial);
      mesh.visible = false;
      handContainer.object3D.add(mesh);
      joints3D.push(mesh);
    }

    // --- CONFIGURAÇÃO DO MEDIAPIPE HANDS ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        landmarks.forEach((lm, index) => {
          // Converte coordenadas da tela para o espaço 3D da AR
          const x = (lm.x - 0.5) * 1.5;
          const y = -(lm.y - 0.5) * 1.5 + 0.5;
          const z = -lm.z * 1.5;

          joints3D[index].position.set(x, y, z);
          joints3D[index].visible = true;
        });
      } else {
        joints3D.forEach(j => j.visible = false);
      }
    });

    // --- LÓGICA DE INICIALIZAÇÃO DA CÂMERA ---
    startBtn.addEventListener('click', async () => {
      statusLog.innerText = "Iniciando sistema AR...";
      startBtn.style.display = "none";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });

        hiddenVideo.srcObject = stream;
        await hiddenVideo.play();

        statusLog.innerText = "AR Ativa! Aponte a câmera para o marcador Hiro.";

        const processLoop = async () => {
          if (!hiddenVideo.paused && !hiddenVideo.ended) {
            await hands.send({ image: hiddenVideo });
          }
          requestAnimationFrame(processLoop);
        };
        processLoop();

      } catch (err) {
        statusLog.innerText = "Erro ao acessar a câmera: " + err.message;
        startBtn.style.display = "block";
      }
    });
  </script>
</body>
</html>
