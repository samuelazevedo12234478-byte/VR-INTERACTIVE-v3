<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest Spatial OS - Mão Virtual (Sem Esqueleto)</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: sans-serif; }
    .a-enter-vr { display: none !important; }
    #webcam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; }
    a-scene { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
    #hand_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
    #startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200; padding: 18px 36px; font-size: 1.1rem; font-weight: bold; color: #ffffff; background: linear-gradient(135deg, #f97316, #ea580c); border: none; border-radius: 50px; cursor: pointer; }
    #statusLog { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; color: #1e293b; font-size: 0.9rem; font-weight: 700; background: rgba(255, 255, 255, 0.92); padding: 10px 24px; border-radius: 30px; border: 2px solid #f97316; }
  </style>
</head>
<body>

  <button id="startBtn">🚀 Iniciar AR</button>
  <div id="statusLog">Clique para iniciar</div>
  
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="hand_canvas"></canvas>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-entity id="main-camera" camera look-controls="enabled: true; magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('statusLog');

    function updateCanvasSize() {
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', updateCanvasSize);
    updateCanvasSize();

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          drawQuestHand(landmarks);
        }
      }
    });

    function drawQuestHand(landmarks) {
      const screenW = handCanvas.width;
      const screenH = handCanvas.height;

      // Sequência que desenha o contorno da mão (Dedo a dedo)
      // Vai do pulso -> polegar -> pontas dos dedos -> pulso
      const outline = [0, 1, 2, 3, 4, 3, 2, 5, 8, 7, 6, 5, 9, 12, 11, 10, 9, 13, 16, 15, 14, 13, 17, 20, 19, 18, 17, 0];

      handCtx.beginPath();
      
      outline.forEach((idx, i) => {
        const pt = landmarks[idx];
        const x = pt.x * screenW;
        const y = pt.y * screenH;
        if (i === 0) handCtx.moveTo(x, y);
        else handCtx.lineTo(x, y);
      });

      handCtx.closePath();

      // Preenchimento transparente
      handCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      handCtx.fill();

      // Borda brilhante externa
      handCtx.strokeStyle = '#ffffff';
      handCtx.lineWidth = 4;
      handCtx.lineJoin = 'round';
      handCtx.shadowColor = '#ffffff';
      handCtx.shadowBlur = 10;
      handCtx.stroke();
      
      handCtx.shadowBlur = 0;
    }

    async function startApp() {
      startBtn.style.display = 'none';
      const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 1280, height: 720, facingMode: 'environment'
      });
      await camera.start();
      statusLog.innerText = "✨ Modo Quest (Contorno Ativo)";
    }

    startBtn.addEventListener('click', startApp);
  </script>
</body>
</html>
