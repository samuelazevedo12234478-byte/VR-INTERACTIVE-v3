<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MR VR Box - Cursor Laser</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
    #webcam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
    #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    #ui-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 90%; max-width: 400px; }
    #startBtn { padding: 16px 32px; font-size: 1.1rem; font-weight: bold; color: #ffffff; background: #0066ff; border: 3px solid #ffffff; border-radius: 30px; cursor: pointer; }
    #log { background: rgba(0, 0, 0, 0.85); color: #00ff88; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; text-align: center; width: 100%; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-container">
    <button id="startBtn">LIGAR VR PAISAGEM</button>
    <div id="log">Aponte e use o "fiozinho" (laser) para interagir.</div>
  </div>

  <video id="webcam" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas3d = document.getElementById('canvas3d');
    const startBtn = document.getElementById('startBtn');
    const log = document.getElementById('log');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const cameraGroup = new THREE.Group();
    cameraGroup.add(camera);
    scene.add(cameraGroup);

    const handsGroupContainer = new THREE.Group();
    camera.add(handsGroupContainer);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // --- PAINEL ---
    const uiGroup = new THREE.Group();
    uiGroup.position.set(0, 0, -4.5);
    scene.add(uiGroup);

    const panel = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4), new THREE.MeshStandardMaterial({ color: 0x111122 }));
    uiGroup.add(panel);

    const button3D = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.08), new THREE.MeshStandardMaterial({ color: 0x0066ff }));
    button3D.position.set(0, 0.3, 0.05);
    uiGroup.add(button3D);

    const dragHandle = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 0.05), new THREE.MeshStandardMaterial({ color: 0x00ffff }));
    dragHandle.position.set(0, -0.6, 0.05); // Colado na base do painel
    dragHandle.name = "dragHandle"; 
    uiGroup.add(dragHandle);

    // --- MÃOS E O "FIOZINHO" (RAIO LASER) ---
    const hands3D = [];
    const raycaster = new THREE.Raycaster();

    for (let h = 0; h < 2; h++) {
      const group = new THREE.Group();
      handsGroupContainer.add(group);
      
      // O "Fiozinho" (Linha Laser)
      const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -5)]);
      const rayMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2, transparent: true, opacity: 0.6 });
      const palmRay = new THREE.Line(rayGeo, rayMat);
      palmRay.visible = false;
      group.add(palmRay);
      
      hands3D.push({ group, palmRay });
    }

    let tempoInicioPinch = 0;
    let estaSegurando = false;

    function mapTo3DSpace(lm) {
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance = 2.5;
      const height = 2 * Math.tan(fov / 2) * distance;
      const width = height * camera.aspect;
      return new THREE.Vector3((lm.x - 0.5) * width, -(lm.y - 0.5) * height, -distance + (-lm.z * 1.5));
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        results.multiHandLandmarks.forEach((landmarks, handIndex) => {
          if (handIndex >= 2) return;
          const h3d = hands3D[handIndex];
          
          // Posiciona o ponto de origem do laser na palma (landmark 0 - pulso, ou 9 - base dedo médio)
          const palmPos = mapTo3DSpace(landmarks[9]); 
          h3d.group.position.copy(palmPos);
          h3d.palmRay.visible = true;

          // Detecta pinch (pinça)
          const thumbTip = mapTo3DSpace(landmarks[4]);
          const indexTip = mapTo3DSpace(landmarks[8]);
          const dist = thumbTip.distanceTo(indexTip);

          // Raycasting para o "Fiozinho" (Mira)
          const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
          raycaster.set(palmPos, direction);
          const intersects = raycaster.intersectObjects([button3D, dragHandle]);

          if (dist < 0.25) { // Pinça ativa
             h3d.palmRay.material.color.setHex(0xff0000); // Fio fica vermelho ao clicar
             if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (hit === dragHandle) {
                   uiGroup.position.x = palmPos.x;
                } else if (hit === button3D) {
                   button3D.material.color.setHex(Math.random() * 0xffffff);
                }
             }
          } else {
             h3d.palmRay.material.color.setHex(0x00ffff); // Fio padrão ciano
          }
        });
      } else {
        hands3D.forEach(h => h.palmRay.visible = false);
      }
    });

    // Animação básica
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // ... (restante do código de câmera e orientação permanece igual)
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = "none";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      video.play();
      const processFrame = async () => {
        if (!video.paused) await hands.send({ image: video });
        requestAnimationFrame(processFrame);
      };
      processFrame();
    });
  </script>
</body>
</html>
