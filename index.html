<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MR VR Box - Mão Presa à Câmera</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
    #webcam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; display: block; }
    #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    #ui-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 90%; max-width: 400px; }
    #startBtn { padding: 16px 32px; font-size: 1.1rem; font-weight: bold; color: #ffffff; background: #0066ff; border: 3px solid #ffffff; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }
    #log { background: rgba(0, 0, 0, 0.85); color: #00ff88; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; text-align: center; width: 100%; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="ui-container">
    <button id="startBtn">LIGAR VR PAISAGEM</button>
    <div id="log">Coloque o celular em paisagem e toque no botão.</div>
  </div>

  <video id="webcam" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas3d = document.getElementById('canvas3d');
    const startBtn = document.getElementById('startBtn');
    const log = document.getElementById('log');

    // --- CENA THREE.JS ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // Grupo que o GIROSCÓPIO movimenta (Câmera + Mãos acompanham a cabeça)
    const cameraGroup = new THREE.Group();
    cameraGroup.add(camera);
    scene.add(cameraGroup);

    // Grupo ONDE AS MÃOS FICAM PRESA (para não sofrer o giro do mundo)
    const handsGroupContainer = new THREE.Group();
    camera.add(handsGroupContainer); // <--- MÃOS DENTRO DA CÂMERA!

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Luzes
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    // --- PAINEL 3D (FICA FIXO NO MUNDO DENTRO DA SCENE) ---
    const uiGroup = new THREE.Group();
    uiGroup.position.set(0, 0, -3); // 3 metros na frente do ponto inicial
    scene.add(uiGroup);

    const panelGeo = new THREE.PlaneGeometry(2.4, 1.4);
    const panelMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.4, side: THREE.DoubleSide });
    uiGroup.add(new THREE.Mesh(panelGeo, panelMat));

    const btnGeo = new THREE.BoxGeometry(0.8, 0.3, 0.08);
    const btnMat = new THREE.MeshStandardMaterial({ color: 0x0066ff });
    const button3D = new THREE.Mesh(btnGeo, btnMat);
    button3D.position.set(0, 0.3, 0.05);
    uiGroup.add(button3D);

    const trackGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.6, 16);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const sliderTrack = new THREE.Mesh(trackGeo, trackMat);
    sliderTrack.rotation.z = Math.PI / 2;
    sliderTrack.position.set(0, -0.3, 0.05);
    uiGroup.add(sliderTrack);

    const knobGeo = new THREE.SphereGeometry(0.09, 16, 16);
    const knobMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
    const sliderKnob = new THREE.Mesh(knobGeo, knobMat);
    sliderKnob.position.set(0, -0.3, 0.08);
    uiGroup.add(sliderKnob);

    // --- MÃOS 3D E RAIOS (ADICIONADAS DENTRO DO handsGroupContainer) ---
    const handMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.5 });
    const jointGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const boneGeo = new THREE.CylinderGeometry(0.04, 0.04, 1, 8);

    const rayMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 4 });
    const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -10)]);

    const hands3D = [];
    for (let h = 0; h < 2; h++) {
      const group = new THREE.Group();
      handsGroupContainer.add(group); // Preso na câmera!

      const joints = [];
      for (let i = 0; i < 21; i++) {
        const joint = new THREE.Mesh(jointGeo, handMaterial);
        joint.visible = false;
        group.add(joint);
        joints.push(joint);
      }

      const bones = [];
      for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
        const bone = new THREE.Mesh(boneGeo, handMaterial);
        bone.visible = false;
        group.add(bone);
        bones.push(bone);
      }

      const palmRay = new THREE.Line(rayGeo, rayMat.clone());
      palmRay.visible = false;
      handsGroupContainer.add(palmRay); // Preso na câmera!

      hands3D.push({ group, joints, bones, palmRay });
    }

    let tempoInicioPinch = 0;
    let estaSegurando = false;
    let raycaster = new THREE.Raycaster();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    function mapTo3DSpace(lm) {
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance = 2.5; // Distância fixa na frente da câmera
      const height = 2 * Math.tan(fov / 2) * distance;
      const width = height * camera.aspect;

      // Inverte X para bater com a câmera frontal/traseira espelhada
      const x = (0.5 - lm.x) * width;
      const y = -(lm.y - 0.5) * height;
      const z = -distance + (-lm.z * 1.5);

      return new THREE.Vector3(x, y, z);
    }

    // --- MEDIAPIPE HANDS ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      hands3D.forEach(h => {
        h.joints.forEach(j => j.visible = false);
        h.bones.forEach(b => b.visible = false);
        h.palmRay.visible = false;
      });

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        results.multiHandLandmarks.forEach((landmarks, handIndex) => {
          if (handIndex >= 2) return;

          const h3d = hands3D[handIndex];

          landmarks.forEach((lm, index) => {
            const pos = mapTo3DSpace(lm);
            h3d.joints[index].position.copy(pos);
            h3d.joints[index].visible = true;
          });

          HAND_CONNECTIONS.forEach((conn, index) => {
            const p1 = h3d.joints[conn[0]].position;
            const p2 = h3d.joints[conn[1]].position;

            const bone = h3d.bones[index];
            const dist = p1.distanceTo(p2);

            bone.scale.set(1, dist, 1);
            bone.position.copy(p1).add(p2).multiplyScalar(0.5);
            bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
            bone.visible = true;
          });

          if (h3d.joints[0].visible && h3d.joints[9].visible) {
            const wristPos = h3d.joints[0].position;
            const middleBasePos = h3d.joints[9].position;
            const indexBasePos = h3d.joints[5].position;
            const pinkyBasePos = h3d.joints[17].position;

            // Ponto central da palma
            const palmCenter = new THREE.Vector3().addVectors(wristPos, middleBasePos).multiplyScalar(0.5);
            
            // Vetor normal apontando PARA A FRENTE DA PALMA (saindo da mão em direção à tela)
            const v1 = new THREE.Vector3().subVectors(indexBasePos, wristPos);
            const v2 = new THREE.Vector3().subVectors(pinkyBasePos, wristPos);
            
            // Invertemos a ordem no cross product para apontar para a FRENTE (fiozinho pra frente)
            const palmForward = new THREE.Vector3().crossVectors(v2, v1).normalize();

            // Seta a posição do raio saindo da palma
            h3d.palmRay.position.copy(palmCenter);
            const targetPos = palmCenter.clone().add(palmForward.clone().multiplyScalar(10));
            h3d.palmRay.lookAt(targetPos);
            h3d.palmRay.visible = true;

            // Raycaster convertendo a posição local para a cena do mundo
            const worldPalmPos = palmCenter.clone().applyMatrix4(camera.matrixWorld);
            const worldForward = palmForward.clone().transformDirection(camera.matrixWorld);

            raycaster.set(worldPalmPos, worldForward);
            const intersects = raycaster.intersectObjects([button3D, sliderKnob]);

            const thumbTip = h3d.joints[4].position;
            const indexTip = h3d.joints[8].position;
            const distancePinch = thumbTip.distanceTo(indexTip);

            if (distancePinch < 0.25) {
              if (tempoInicioPinch === 0) tempoInicioPinch = Date.now();
              const tempoPassado = Date.now() - tempoInicioPinch;

              if (tempoPassado >= 1000) {
                estaSegurando = true;
                h3d.palmRay.material.color.setHex(0x00ff00);

                if (intersects.length > 0 && intersects[0].object === sliderKnob || estaSegurando) {
                  sliderKnob.position.x = Math.max(-0.8, Math.min(0.8, palmCenter.x));
                }
              } else {
                h3d.palmRay.material.color.setHex(0xffff00);
              }
            } else {
              if (tempoInicioPinch > 0) {
                const tempoTotal = Date.now() - tempoInicioPinch;
                if (tempoTotal < 1000 && !estaSegurando) {
                  if (intersects.length > 0 && intersects[0].object === button3D) {
                    button3D.material.color.setHex(Math.random() * 0xffffff);
                    log.innerText = "Botão Clicado!";
                  }
                }
              }
              tempoInicioPinch = 0;
              estaSegurando = false;
              h3d.palmRay.material.color.setHex(0xffffff);
            }
          }
        });
      }
    });

    // --- GIROSCÓPIO (Roda APENAS a câmera, as mãos continuam presas a ela) ---
    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function handleOrientation(event) {
      if (!event.alpha) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha);
      const beta = THREE.MathUtils.degToRad(event.beta);
      const gamma = THREE.MathUtils.degToRad(event.gamma);
      const orient = THREE.MathUtils.degToRad(window.orientation || 90);

      euler.set(beta, alpha, -gamma, 'YXZ');
      cameraGroup.quaternion.setFromEuler(euler);
      cameraGroup.quaternion.multiply(q1);
      cameraGroup.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    startBtn.addEventListener('click', async () => {
      log.innerText = "Iniciando VR...";

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) { console.error(e); }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      startBtn.style.display = "none";

      try {
        const constraints = {
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        await new Promise((resolve) => {
          video.onloadedmetadata = () => { video.play(); resolve(); };
        });

        log.innerText = "VR Ativo!";

        const processFrame = async () => {
          if (!video.paused && !video.ended) {
            await hands.send({ image: video });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        console.error(err);
        log.innerText = "Erro ao carregar câmera: " + err.message;
        startBtn.style.display = "block";
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
