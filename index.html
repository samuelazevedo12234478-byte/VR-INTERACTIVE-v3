<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mão Virtual - Estilo Meta Quest 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carregamento seguro e direto do MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1635913746/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620919413/drawing_utils.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a0f2e, #2e1a47, #1a2b4a);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
        }
        #video {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0.2;
            transform: scaleX(-1);
        }
        #canvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            transform: scaleX(-1);
        }
        .info {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 12px rgba(0,255,255,0.7);
            padding: 0 15px;
        }
        .status {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            padding: 12px 25px;
            border-radius: 50px;
            color: #a0f0ff;
            border: 1px solid rgba(0,255,255,0.3);
            font-size: 15px;
            z-index: 10;
        }
        .erro { color: #ff8888; border-color: #ff6666; }
    </style>
</head>
<body>
    <div class="info">
        <h1 class="text-[clamp(1.3rem,4vw,2.2rem)] font-bold text-cyan-300">Mão Virtual ✋</h1>
        <p class="text-cyan-100 text-sm">Permita a câmera e aproxime as mãos</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="status" id="status">🔄 Preparando...</div>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status');

        // Ajusta tamanho do canvas
        function ajustarTamanho() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarTamanho);
        ajustarTamanho();

        // Espera carregar tudo antes de iniciar
        window.addEventListener('DOMContentLoaded', () => {
            statusText.innerText = "🔄 Carregando rastreador de mãos...";

            // Inicializa rastreador
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.65,
                minTrackingConfidence: 0.65
            });

            hands.onResults((results) => {
                statusText.innerText = results.multiHandLandmarks 
                    ? "✅ Mão detectada! Movimente!" 
                    : "⏳ Aguardando mão...";

                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        // Linhas brilhantes e suaves
                        canvasCtx.lineWidth = 6;
                        canvasCtx.lineCap = 'round';
                        canvasCtx.lineJoin = 'round';
                        const gradiente = canvasCtx.createLinearGradient(0,0, canvasElement.width, canvasElement.height);
                        gradiente.addColorStop(0, 'rgba(0, 255, 255, 0.85)');
                        gradiente.addColorStop(1, 'rgba(180, 120, 255, 0.85)');
                        canvasCtx.strokeStyle = gradiente;
                        canvasCtx.shadowColor = '#00ffff';
                        canvasCtx.shadowBlur = 18;

                        const pontos = [0,1,2,3,4,0,5,6,7,8,9,10,11,12,5,9,13,14,15,16,17,18,19,20];
                        canvasCtx.beginPath();
                        for(let i=0; i<pontos.length; i++){
                            const p = landmarks[pontos[i]];
                            const x = p.x * canvasElement.width;
                            const y = p.y * canvasElement.height;
                            i===0 ? canvasCtx.moveTo(x,y) : canvasCtx.lineTo(x,y);
                        }
                        canvasCtx.stroke();

                        // Pontas brilhantes
                        const dedos = [4,8,12,16,20];
                        dedos.forEach(i => {
                            const p = landmarks[i];
                            const x = p.x * canvasElement.width;
                            const y = p.y * canvasElement.height;
                            const gradBola = canvasCtx.createRadialGradient(x,y,0,x,y,22);
                            gradBola.addColorStop(0,'rgba(255,255,255,0.95)');
                            gradBola.addColorStop(1,'rgba(0,255,255,0)');
                            canvasCtx.beginPath();
                            canvasCtx.arc(x,y,22,0,Math.PI*2);
                            canvasCtx.fillStyle = gradBola;
                            canvasCtx.fill();
                            canvasCtx.beginPath();
                            canvasCtx.arc(x,y,7,0,Math.PI*2);
                            canvasCtx.fillStyle = '#fff';
                            canvasCtx.fill();
                        });
                    }
                }
            });

            // Inicia câmera com tratamento de erro
            statusText.innerText = "🔄 Solicitando permissão da câmera...";
            const camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 1280, height: 720
            });

            camera.start()
            .then(() => { statusText.innerText = "✅ Pronto! Aproxime as mãos!"; })
            .catch(err => {
                statusText.className = "status erro";
                statusText.innerHTML = "❌ Erro! Permita a câmera nas configurações do site!";
                console.error("Erro:", err);
                alert("Para funcionar, você precisa PERMITIR o uso da câmera quando o navegador pedir!");
            });
        });
    </script>
</body>
</html>
