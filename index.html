<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest Spatial OS - Mão Virtual (Contorno)</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .a-enter-vr { display: none !important; }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    #hand_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(234, 88, 12, 0.4);
      transition: all 0.2s ease;
    }

    #statusLog {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      color: #1e293b;
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 24px;
      border-radius: 30px;
      border: 2px solid #f97316;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <button id="startBtn">🚀 Iniciar AR (Modo Meta Quest)</button>
  <div id="statusLog">Clique para iniciar</div>
  
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="hand_canvas"></canvas>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-entity id="main-camera" camera look-controls="enabled: true; magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('statusLog');

    function updateCanvasSize() {
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', updateCanvasSize);
    updateCanvasSize();

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawQuestHandMesh(landmarks);
        }
      }

      handCtx.restore();
    });

    function drawQuestHandMesh(landmarks) {
      const screenW = handCanvas.width;
      const screenH = handCanvas.height;

      // Perímetro externo da mão conectando o contorno dos dedos e palma
      const PERIMETER_INDICES = [
        0, 1, 2, 3, 4,          // Polegar
        3, 2, 5, 6, 7, 8,       // Indicador
        7, 6, 9, 10, 11, 12,    // Médio
        11, 10, 13, 14, 15, 16, // Anelar
        15, 14, 17, 18, 19, 20, // Mínimo
        17, 0                   // Lateral do pulso
      ];

      // Desenha a malha contínua
      handCtx.beginPath();
      const startPt = landmarks[PERIMETER_INDICES[0]];
      handCtx.moveTo(startPt.x * screenW, startPt.y * screenH);

      for (let i = 1; i < PERIMETER_INDICES.length; i++) {
        const pt = landmarks[PERIMETER_INDICES[i]];
        handCtx.lineTo(pt.x * screenW, pt.y * screenH);
      }

      handCtx.closePath();

      // Preenchimento com cinza transparente
      handCtx.fillStyle = 'rgba(180, 185, 200, 0.35)';
      handCtx.fill();

      // Borda branca brilhante estilo Quest
      handCtx.strokeStyle = '#ffffff';
      handCtx.lineWidth = 3;
      handCtx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      handCtx.shadowBlur = 10;
      handCtx.stroke();

      handCtx.shadowBlur = 0;

      // Pequenos pontos de tracking nas pontas dos dedos
      const FINGERTIPS = [4, 8, 12, 16, 20];
      for (const idx of FINGERTIPS) {
        const tip = landmarks[idx];
        handCtx.beginPath();
        handCtx.arc(tip.x * screenW, tip.y * screenH, 4, 0, 2 * Math.PI);
        handCtx.fillStyle = '#ffffff';
        handCtx.fill();
      }
    }

    async function startApp() {
      startBtn.style.display = 'none';

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
      }

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: 'environment'
      });

      try {
        await camera.start();
        statusLog.innerText = "✨ Rastreamento Meta Quest (Contorno Virtual)";
      } catch (err) {
        statusLog.innerText = "⚠️ Erro ao abrir a câmera.";
      }
    }

    startBtn.addEventListener('click', startApp);
  </script>
</body>
</html>
