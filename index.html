<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MR VR Box - Completo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #ui-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; text-align: center; color: white; pointer-events: none; }
    #log { background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; font-size: 1.2rem; }
    #webcam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
    #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    #startBtn { pointer-events: auto; padding: 15px 30px; background: #0066ff; color: white; border: none; border-radius: 20px; margin-top: 10px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

<div id="ui-container">
  <div id="log">Pressione para iniciar</div>
  <button id="startBtn">INICIAR VR</button>
</div>

<video id="webcam" playsinline autoplay muted></video>
<canvas id="canvas3d"></canvas>

<script>
  // Setup Three.js
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  const uiGroup = new THREE.Group();
  uiGroup.position.set(0, 0, -4.5); 
  scene.add(uiGroup);
  
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.2), new THREE.MeshBasicMaterial({color: 0x333333}));
  uiGroup.add(panel);

  const btn = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.1), new THREE.MeshBasicMaterial({color: 0x00ff00}));
  btn.position.y = 0.3;
  btn.name = "btnStart";
  uiGroup.add(btn);

  const dragHandle = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 0.1), new THREE.MeshBasicMaterial({color: 0x00ffff}));
  dragHandle.position.y = -0.6;
  dragHandle.name = "dragHandle";
  uiGroup.add(dragHandle);

  // Estados
  let gameState = 'IDLE';
  let sequence = [];
  let playerIndex = 0;
  let isDraggingScreen = false;
  const raycaster = new THREE.Raycaster();

  function getGesture(lm) {
    const distPinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
    const distFist = Math.hypot(lm[8].y - lm[0].y, lm[12].y - lm[0].y);
    if (distPinch < 0.05) return 'PINÇA';
    if (distFist < 0.15) return 'FECHADA';
    return 'ABERTA';
  }

  // MediaPipe
  const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
  hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
  
  hands.onResults(results => {
    if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      const gesture = getGesture(lm);
      const palmCenter = new THREE.Vector3((lm[0].x - 0.5) * 4, -(lm[0].y - 0.5) * 2, -2);
      
      raycaster.set(new THREE.Vector3(0,0,0), new THREE.Vector3(palmCenter.x, palmCenter.y, -1).normalize());
      const intersects = raycaster.intersectObjects(uiGroup.children);

      // Jogo
      if(gameState === 'IDLE' && gesture === 'PINÇA' && intersects.length > 0 && intersects[0].object.name === "btnStart") {
         startGame();
      }

      // Arraste
      if (gesture === 'PINÇA') {
        if (!isDraggingScreen && intersects.length > 0 && intersects[0].object.name === "dragHandle") {
            isDraggingScreen = true;
        }
        if (isDraggingScreen) {
            uiGroup.position.x = palmCenter.x * 2;
        }
      } else {
        isDraggingScreen = false;
      }
    }
  });

  function startGame() {
    gameState = 'PLAYING';
    sequence = ['PINÇA', 'FECHADA'];
    playerIndex = 0;
    document.getElementById('log').innerText = "Sequência: " + sequence.join(" -> ");
  }

  // Loop de Processamento (O que faltava!)
  const video = document.getElementById('webcam');
  async function processFrame() {
    if (video.readyState >= 2) await hands.send({ image: video });
    requestAnimationFrame(processFrame);
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    const stream = await navigator.mediaDevices.getUserMedia({video: true});
    video.srcObject = stream;
    document.getElementById('startBtn').style.display = 'none';
    processFrame();
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
