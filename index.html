<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Mão</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* O botão fica fixo no centro e na camada mais ALTA (z-index: 9999) */
    #startBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      padding: 18px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: 3px solid #ffffff;
      border-radius: 50px;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      opacity: 1 !important; /* Força ficar totalmente opaco */
    }

    #startBtn:active {
      background-color: #0056b3;
      transform: translate(-50%, -50%) scale(0.95);
    }

    /* O vídeo fica atrás */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* O canvas do esqueleto da mão fica no meio */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 2;
      pointer-events: none; /* Não bloqueia toques */
    }

    #log {
      position: fixed;
      bottom: 20px;
      left: 5% ;
      width: 90%;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px;
      font-size: 0.9rem;
      border-radius: 8px;
      z-index: 9998;
      text-align: center;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <button id="startBtn">LIGAR CÂMERA</button>

  <video id="webcam" playsinline webkit-playsinline></video>
  
  <canvas id="output_canvas"></canvas>

  <div id="log">Status: Toque no botão azul acima para iniciar.</div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const log = document.getElementById('log');
    const startBtn = document.getElementById('startBtn');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      canvas.width = video.videoWidth || window.innerWidth;
      canvas.height = video.videoHeight || window.innerHeight;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          // Linhas de conexão estilo Quest
          for (const connection of HAND_CONNECTIONS) {
            const from = landmarks[connection[0]];
            const to = landmarks[connection[1]];
            ctx.beginPath();
            ctx.moveTo(from.x * canvas.width, from.y * canvas.height);
            ctx.lineTo(to.x * canvas.width, to.y * canvas.height);
            ctx.strokeStyle = '#00FF88';
            ctx.lineWidth = 5;
            ctx.stroke();
          }

          // Pontos das articulações
          for (const landmark of landmarks) {
            const x = landmark.x * canvas.width;
            const y = landmark.y * canvas.height;
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#FF0055';
            ctx.fill();
          }
        }
      }
      ctx.restore();
    });

    startBtn.addEventListener('click', async () => {
      log.innerText = "Solicitando permissão da câmera...";
      startBtn.style.display = "none"; // Esconde o botão ao clicar

      try {
        let stream;
        try {
          // Tenta a câmera traseira
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
          });
        } catch (e) {
          // Se falhar a regra traseira, tenta qualquer câmera
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
        }

        video.srcObject = stream;
        await video.play();

        log.innerText = "Câmera ativa! Aponta para a sua mão.";

        const processFrame = async () => {
          if (!video.paused && !video.ended) {
            await hands.send({ image: video });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        log.innerText = "Erro ao acessar câmera: " + err.message;
        startBtn.style.display = "block"; // Reexibe o botão se der erro
        alert("Não foi possível acessar a câmera: " + err.message);
      }
    });
  </script>
</body>
</html>
