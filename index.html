<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spatial OS - Janelas AR & Hand Tracking</title>

  <!-- Bibliotecas 3D / AR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: sans-serif; }
    
    #hand_canvas { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      z-index: 10; 
      pointer-events: none; 
      filter: blur(1.5px); 
    }

    .a-canvas { z-index: 1; }

    #startBtn { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 200; 
      padding: 18px 36px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      color: #ffffff; 
      background: #f97316; 
      border: none; 
      border-radius: 50px; 
      cursor: pointer; 
      box-shadow: 0 10px 30px rgba(249, 115, 22, 0.4);
    }
  </style>
</head>
<body>

  <button id="startBtn">🚀 Iniciar Interface AR + Mão Virtual</button>

  <canvas id="hand_canvas"></canvas>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
    vr-mode-ui="enabled: false">
    
    <a-marker preset="hiro">
      <a-entity position="0 0.5 0" rotation="-45 0 0">
        <a-plane position="0 0.85 0" width="2.2" height="0.2" color="#202124"></a-plane>
        <a-circle position="-0.95 0.85 0.01" radius="0.03" color="#FF5F56"></a-circle>
        <a-circle position="-0.85 0.85 0.01" radius="0.03" color="#FFBD2E"></a-circle>
        <a-circle position="-0.75 0.85 0.01" radius="0.03" color="#27C93F"></a-circle>
        <a-plane position="0.05 0.85 0.01" width="1.4" height="0.1" color="#35363a"></a-plane>
        
        <a-plane position="0 0 0" width="2.2" height="1.5" color="#ffffff" opacity="0.95">
          <a-text value="Google Chrome AR" color="#000" align="center" position="0 0.4 0.01" scale="0.8 0.8 0.8"></a-text>
          <a-plane position="0 -0.1 0.01" width="1.8" height="0.6" color="#f1f3f4"></a-plane>
          <a-text value="Sua Janela Fixa no Espaco 3D" color="#5f6368" align="center" position="0 -0.1 0.02" scale="0.5 0.5 0.5"></a-text>
        </a-plane>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');

    function updateCanvasSize() {
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', updateCanvasSize);
    updateCanvasSize();

    const hands = new Hands({ 
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` 
    });
    
    hands.setOptions({ 
      maxNumHands: 2, 
      modelComplexity: 1, 
      minDetectionConfidence: 0.7, 
      minTrackingConfidence: 0.7 
    });

    hands.onResults((results) => {
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          drawQuestHandMesh(landmarks);
        }
      }
    });

    function drawQuestHandMesh(landmarks) {
      const screenW = handCanvas.width;
      const screenH = handCanvas.height;
      
      const wrist = landmarks[0];
      const middleBase = landmarks[9];
      const palmSize = Math.hypot((middleBase.x - wrist.x) * screenW, (middleBase.y - wrist.y) * screenH);
      
      const fingerThickness = Math.max(20, palmSize * 0.24); 
      const getPos = (idx) => ({ x: landmarks[idx].x * screenW, y: landmarks[idx].y * screenH });

      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';

      const fingers = [
        [0, 1, 2, 3, 4],     
        [0, 5, 6, 7, 8],     
        [0, 9, 10, 11, 12],  
        [0, 13, 14, 15, 16], 
        [0, 17, 18, 19, 20]  
      ];

      const skinColor = 'rgba(120, 120, 125, 0.75)';

      handCtx.fillStyle = skinColor;
      handCtx.strokeStyle = skinColor;
      handCtx.lineWidth = fingerThickness;

      const palmIndices = [0, 1, 2, 5, 9, 13, 17, 18];
      handCtx.beginPath();
      const startPalm = getPos(palmIndices[0]);
      handCtx.moveTo(startPalm.x, startPalm.y);
      for (let i = 1; i < palmIndices.length; i++) {
        const pos = getPos(palmIndices[i]);
        handCtx.lineTo(pos.x, pos.y);
      }
      handCtx.closePath();
      handCtx.fill();

      fingers.forEach(finger => {
        handCtx.beginPath();
        finger.forEach((idx, i) => {
          const pos = getPos(idx);
          if (i === 0) handCtx.moveTo(pos.x, pos.y);
          else handCtx.lineTo(pos.x, pos.y);
        });
        handCtx.stroke();
      });
    }

    // Inicialização sem duplicar a câmera
    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      
      // Aguarda o AR.js criar a tag de vídeo da câmera para usá-la no MediaPipe
      const checkVideo = setInterval(() => {
        const arVideo = document.querySelector('video');
        if (arVideo && arVideo.readyState === 4) {
          clearInterval(checkVideo);
          
          // Loop contínuo usando o vídeo do próprio AR.js
          async function processFrame() {
            await hands.send({ image: arVideo });
            requestAnimationFrame(processFrame);
          }
          processFrame();
        }
      }, 300);
    });
  </script>
</body>
</html>
